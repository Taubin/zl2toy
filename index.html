<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZL2TOY • Dusty • Auckland, New Zealand</title>
  <meta name="description" content="Amateur radio station ZL2TOY. Dusty, Auckland, New Zealand. FT8 and digital modes on a Xiegu G90.">
  <meta name="theme-color" content="#03070a">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ZL2TOY • Dusty • Auckland, New Zealand">
  <meta property="og:description" content="Amateur radio station ZL2TOY. FT8 and digital modes from Aotearoa.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=space-grotesk:400,500,700,800|jetbrains-mono:400,600,700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg-void: #03070a;
      --bg-card: rgba(8, 22, 31, 0.9);
      --teal: #3fb59a;
      --teal-dim: rgba(63, 181, 154, 0.2);
      --teal-glow: rgba(63, 181, 154, 0.35);
      --amber: #f2b84b;
      --paper: #edf3f2;
      --muted: #8fa7ab;
      --border-subtle: rgba(63, 181, 154, 0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg-void); }
    body {
      background-color: var(--bg-void);
      color: var(--paper);
      font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 3vw, 40px);
      background-image:
        radial-gradient(circle at 85% 15%, rgba(20, 75, 87, 0.28) 0%, transparent 60%),
        radial-gradient(circle at 15% 85%, rgba(10, 36, 46, 0.35) 0%, transparent 60%);
    }
    a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

    .station-hub {
      width: 100%;
      max-width: 1040px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }
    .main-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; }
    @media (max-width: 860px) { .main-grid { grid-template-columns: 1fr; } }

    .identity-pane {
      padding: clamp(28px, 4.5vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .callsign-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
    .callsign {
      font-size: clamp(3.2rem, 7vw, 5.2rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--amber);
    }
    .rx-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--teal);
      background: rgba(63, 181, 154, 0.12);
      border: 1px solid var(--teal-dim);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .rx-badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
    }
    .rx-badge.live::before { background: var(--teal); box-shadow: 0 0 8px var(--teal); animation: pulse 1.8s ease-in-out infinite; }
    .op-name { font-size: 1.5rem; font-weight: 700; margin-top: 12px; }
    .op-qth { font-size: 1.05rem; color: var(--muted); margin-top: 2px; }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 16px 20px;
      background: rgba(3, 9, 14, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
    }
    @media (max-width: 480px) { .telemetry-grid { grid-template-columns: repeat(2, 1fr); } }
    .telemetry-node .label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
    }
    .telemetry-node .value {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--teal);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .station-list { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; font-size: 0.98rem; }
    .station-list dt { color: var(--muted); }
    .station-list dd { color: var(--paper); }
    .station-list [hidden] { display: none; }

    .spots h2 { font-size: 0.95rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    .spot-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr 3rem 4.5rem;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--paper);
    }
    .spot-row span:nth-child(1) { color: var(--muted); }
    .spot-row span:nth-child(3), .spot-row span:nth-child(4) { text-align: right; color: var(--teal); }

    .actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: 6px;
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-primary { background: var(--teal); color: var(--bg-void); border: 1px solid var(--teal); }
    .btn-primary:hover { background: #4ecdb0; box-shadow: 0 4px 16px var(--teal-glow); }
    .btn-ghost { color: var(--paper); border: 1px solid var(--border-subtle); }
    .btn-ghost:hover { border-color: var(--teal); }

    .illustration-pane {
      background: linear-gradient(160deg, #09202a 0%, #040d12 70%);
      border-left: 1px solid var(--border-subtle);
      display: flex; align-items: flex-end; justify-content: center;
      overflow: hidden;
    }
    @media (max-width: 860px) {
      .illustration-pane { border-left: none; border-top: 1px solid var(--border-subtle); }
    }
    .art-svg { width: 100%; height: auto; display: block; }
    .strobe { animation: strobe 2.4s steps(1) infinite; }

    .waterline-bar {
      min-height: 48px;
      background: rgba(3, 7, 10, 0.95);
      border-top: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 4px 16px;
      padding: 8px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--amber);
      font-weight: 600;
    }
    .waterline-bar .clock { font-variant-numeric: tabular-nums; }

    @keyframes pulse { 50% { opacity: 0.35; } }
    @keyframes strobe { 0%, 100% { opacity: 1; } 12% { opacity: 0.1; } }
    @media (prefers-reduced-motion: reduce) {
      .rx-badge.live::before, .strobe { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="station-hub">
    <div class="main-grid">

      <section class="identity-pane">
        <div>
          <div class="callsign-row">
            <h1 class="callsign" id="callsign">ZL2TOY</h1>
            <span class="rx-badge" id="status-badge">QRV</span>
          </div>
          <div class="op-name" id="op-name">Dusty</div>
          <div class="op-qth" id="op-qth">Tāmaki Makaurau • Auckland, New Zealand</div>
        </div>

        <div class="telemetry-grid">
          <div class="telemetry-node"><span class="label">Maidenhead</span><span class="value" id="t-grid">RF73</span></div>
          <div class="telemetry-node"><span class="label">CQ zone</span><span class="value" id="t-cq">32</span></div>
          <div class="telemetry-node"><span class="label">ITU zone</span><span class="value" id="t-itu">60</span></div>
          <div class="telemetry-node"><span class="label">UTC offset</span><span class="value" id="t-off">+13</span></div>
        </div>

        <dl class="station-list" id="station-list">
          <dt>Rig</dt><dd id="s-rig">Xiegu G90</dd>
          <dt hidden>Antenna</dt><dd id="s-ant" hidden></dd>
          <dt>Modes</dt><dd id="s-modes">FT8 and other digital modes</dd>
          <dt hidden>Bands</dt><dd id="s-bands" hidden></dd>
          <dt hidden>QSL</dt><dd id="s-qsl" hidden></dd>
          <dt hidden>Contact</dt><dd id="s-contact" hidden></dd>
        </dl>

        <div class="spots" id="spots" hidden>
          <h2>Recent spots</h2>
          <div id="spot-rows"></div>
        </div>

        <div class="actions">
          <a href="https://www.qrz.com/db/ZL2TOY" class="btn btn-primary" id="qrz-btn" target="_blank" rel="noopener">QRZ profile ↗</a>
          <a href="https://pskreporter.info/pskmap.html?preset&callsign=ZL2TOY&timerange=86400" class="btn btn-ghost" id="psk-btn" target="_blank" rel="noopener">PSKReporter map ↗</a>
        </div>
      </section>

      <section class="illustration-pane">
        <svg class="art-svg" viewBox="0 -70 540 458" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-title art-desc">
          <title id="art-title">Auckland skyline and a Xiegu G90 transceiver</title>
          <desc id="art-desc">Stylised night scene of the Auckland skyline with the Sky Tower, Rangitoto, a ham radio tower with a Yagi antenna and the Southern Cross, above a desk with a Xiegu G90 HF transceiver.</desc>
          <defs>
            <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2a343a"/>
              <stop offset="100%" stop-color="#12191e"/>
            </linearGradient>
            <linearGradient id="knob-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3a4750"/>
              <stop offset="100%" stop-color="#0d1317"/>
            </linearGradient>
            <linearGradient id="wf" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1b6f8a"/>
              <stop offset="55%" stop-color="#3fb59a"/>
              <stop offset="100%" stop-color="#f2b84b"/>
            </linearGradient>
            <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0e222c"/>
              <stop offset="100%" stop-color="#060f14"/>
            </linearGradient>
          </defs>

          <!-- Background stars -->
          <g fill="#dbe8ff"><circle cx="294" cy="-35" r="0.8" opacity="0.6"/><circle cx="480" cy="10" r="0.9" opacity="0.57"/><circle cx="520" cy="-15" r="0.8" opacity="0.36"/><circle cx="34" cy="40" r="0.7" opacity="0.54"/><circle cx="451" cy="-20" r="1.0" opacity="0.77"/><circle cx="215" cy="135" r="1.0" opacity="0.74"/><circle cx="365" cy="9" r="1.1" opacity="0.45"/><circle cx="230" cy="139" r="1.0" opacity="0.77"/><circle cx="58" cy="129" r="1.0" opacity="0.58"/><circle cx="448" cy="-45" r="0.5" opacity="0.66"/><circle cx="203" cy="-33" r="0.8" opacity="0.55"/><circle cx="506" cy="142" r="0.9" opacity="0.46"/><circle cx="319" cy="-15" r="0.5" opacity="0.4"/><circle cx="68" cy="103" r="0.9" opacity="0.39"/><circle cx="428" cy="-24" r="0.7" opacity="0.57"/><circle cx="147" cy="-5" r="1.1" opacity="0.72"/><circle cx="315" cy="32" r="0.7" opacity="0.67"/><circle cx="90" cy="59" r="0.5" opacity="0.7"/><circle cx="115" cy="96" r="1.0" opacity="0.59"/><circle cx="100" cy="98" r="0.6" opacity="0.37"/><circle cx="120" cy="-54" r="0.9" opacity="0.44"/><circle cx="147" cy="40" r="0.5" opacity="0.67"/><circle cx="167" cy="-62" r="1.1" opacity="0.44"/><circle cx="145" cy="69" r="0.6" opacity="0.72"/><circle cx="400" cy="-32" r="1.0" opacity="0.72"/><circle cx="81" cy="-38" r="0.9" opacity="0.46"/><circle cx="394" cy="3" r="0.6" opacity="0.7"/><circle cx="362" cy="-32" r="0.8" opacity="0.53"/><circle cx="405" cy="-23" r="1.0" opacity="0.49"/><circle cx="76" cy="3" r="0.7" opacity="0.38"/><circle cx="532" cy="59" r="0.8" opacity="0.67"/><circle cx="391" cy="66" r="0.6" opacity="0.79"/><circle cx="8" cy="-55" r="0.6" opacity="0.61"/><circle cx="132" cy="-54" r="0.7" opacity="0.71"/></g>
          <!-- Stars: Southern Cross (positions and brightness from catalogue; Gacrux is a red giant) -->
          <g filter="url(#star-glow)">
            <circle cx="452" cy="40" r="2.9" fill="#ffb48a"/><!-- Gacrux -->
            <circle cx="460" cy="122" r="3.7" fill="#dbe8ff"/><!-- Acrux -->
            <circle cx="422" cy="75" r="3.3" fill="#dbe8ff"/><!-- Mimosa -->
            <circle cx="480" cy="62" r="2.2" fill="#dbe8ff"/><!-- Delta -->
            <circle cx="469" cy="85" r="1.6" fill="#f2f0ff"/><!-- Epsilon -->
          </g>

          <!-- City scene, shoreline at y=195 -->
          <g transform="translate(0,-50)">
            <g stroke="#3fb59a" fill="none">
              <circle cx="380" cy="150" r="50" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
              <circle cx="380" cy="150" r="95" stroke-width="0.8" opacity="0.2" stroke-dasharray="6 6"/>
              <circle cx="380" cy="150" r="145" stroke-width="0.6" opacity="0.12"/>
            </g>
            <!-- Rangitoto: low, wide shield volcano with a small summit -->
            <polygon points="330,245 370,237 410,228 436,221 452,216 458,213 466,215 478,218 505,227 540,238 540,245" fill="#0b1d26"/>

            <defs>
              <g id="city">
                <rect x="268" y="233" width="14" height="12"/>
                <rect x="284" y="227" width="14" height="18"/>
                <rect x="300" y="222" width="16" height="23"/>
                <rect x="318" y="208" width="20" height="37"/>
                <!-- Vero Centre: slanted roof -->
                <polygon points="342,245 342,198 364,188 364,245"/>
                <rect x="360" y="212" width="14" height="33"/>
                <!-- Commercial Bay / PwC tower -->
                <polygon points="392,245 392,185 412,185 412,191 416,191 416,245"/>
                <rect x="418" y="206" width="20" height="39"/>
                <rect x="440" y="221" width="16" height="24"/>
                <rect x="458" y="232" width="20" height="13"/>
                <rect x="480" y="238" width="14" height="7"/>
              </g>
              <pattern id="win" width="4" height="5" patternUnits="userSpaceOnUse">
                <rect x="1" y="1.5" width="1.4" height="1.6" fill="#f2b84b" opacity="0.35"/>
              </pattern>
            </defs>
            <use href="#city" fill="#040b0f"/>
            <use href="#city" fill="url(#win)"/>

            <!-- Sky Tower: shaft, pod with saucer and upper deck, mast -->
            <g fill="#040b0f">
              <polygon points="372,245 377.5,166 382.5,166 388,245"/>
              <polygon points="366,150 394,150 386,159 382,166 378,166 374,159"/>
              <ellipse cx="380" cy="150" rx="14" ry="3.4"/>
              <rect x="374" y="141" width="12" height="9"/>
              <rect x="372" y="138" width="16" height="3.4"/>
              <rect x="377.5" y="128" width="5" height="10"/>
              <polygon points="379,128 381,128 380.4,98 379.6,98"/>
            </g>
            <g fill="#f2b84b" opacity="0.7"><rect x="368" y="149" width="3" height="1.2"/><rect x="375" y="149" width="3" height="1.2"/><rect x="382" y="149" width="3" height="1.2"/><rect x="389" y="149" width="3" height="1.2"/></g>
            <circle class="strobe" cx="380" cy="99" r="1.8" fill="#ff4d4d"/>

            <!-- Radio tower with Yagi -->
            <g stroke="#10303b" stroke-width="2" fill="none">
              <line x1="202" y1="245" x2="208" y2="135"/>
              <line x1="218" y1="245" x2="212" y2="135"/>
              <line x1="203" y1="225" x2="216" y2="205" stroke-width="1.2"/>
              <line x1="216" y1="205" x2="205" y2="185" stroke-width="1.2"/>
              <line x1="205" y1="185" x2="214" y2="165" stroke-width="1.2"/>
              <line x1="214" y1="165" x2="207" y2="145" stroke-width="1.2"/>
              <line x1="210" y1="135" x2="210" y2="115" stroke-width="2.5"/>
              <line x1="180" y1="115" x2="240" y2="115" stroke-width="3"/>
              <line x1="185" y1="92" x2="185" y2="138" stroke="#3fb59a"/>
              <line x1="210" y1="96" x2="210" y2="134" stroke="#f2b84b"/>
              <line x1="235" y1="100" x2="235" y2="130" stroke="#3fb59a"/>
            </g>

            <line x1="0" y1="245" x2="540" y2="245" stroke="#174853" stroke-width="1.5"/>
            <path d="M 0,245 L 15,244 L 28,245 L 42,243 L 55,245 L 70,244 L 84,245 L 98,243 L 110,245 L 122,244 L 135,242 L 142,228 L 145,214 L 147,215 L 150,229 L 154,244 L 168,245 L 182,243 L 195,245 L 210,244 L 225,245 L 240,243 L 255,245 L 268,244 L 278,236 L 281,210 L 283,188 L 285,188 L 287,212 L 290,238 L 294,244 L 308,245 L 320,243 L 332,245 L 345,244 L 358,245 L 370,243 L 382,245 L 395,244 L 402,232 L 405,216 L 407,220 L 410,234 L 415,244 L 430,245 L 448,243 L 465,245 L 485,244 L 505,245 L 525,243 L 540,245"
                  fill="none" stroke="#3fb59a" stroke-width="1.2" opacity="0.75"/>
          </g>

          <!-- Desk: receding tabletop with a front edge, so the scene ends instead of boxing in -->
          <polygon points="70,345 470,345 540,380 0,380" fill="url(#desk-grad)"/>
          <line x1="70" y1="345" x2="470" y2="345" stroke="#2a4c58" stroke-width="1.5"/>
          <rect x="0" y="380" width="540" height="6" fill="#0a1a22"/>
          <line x1="0" y1="380" x2="540" y2="380" stroke="#2a4c58" stroke-width="1"/>
          <ellipse cx="270" cy="350" rx="185" ry="6" fill="#000" opacity="0.55"/>

          <!-- Xiegu G90, front view, redrawn from reference photo -->
          <g transform="translate(131,212)">
            <!-- Side handle brackets with slots -->
            <rect x="-31" y="2" width="29" height="132" rx="3" fill="#0a0f12" stroke="#2a3a44" stroke-width="1"/>
            <rect x="-20" y="18" width="9" height="90" rx="4" fill="#050b0e"/>
            <rect x="280" y="2" width="29" height="132" rx="3" fill="#0a0f12" stroke="#2a3a44" stroke-width="1"/>
            <rect x="291" y="18" width="9" height="90" rx="4" fill="#050b0e"/>

            <!-- Top cover lip -->
            <rect x="4" y="-9" width="270" height="10" rx="2" fill="#1a232a" stroke="#2a3a44" stroke-width="0.8"/>
            <g fill="#2c3942"><rect x="90" y="-5" width="16" height="3" rx="1"/><rect x="112" y="-5" width="16" height="3" rx="1"/><rect x="134" y="-5" width="16" height="3" rx="1"/></g>

            <!-- Front panel -->
            <rect x="0" y="0" width="278" height="126" rx="4" fill="#0d1317" stroke="#34444e" stroke-width="1.4"/>
            <rect x="3" y="3" width="272" height="120" rx="3" fill="none" stroke="#18242b" stroke-width="0.8"/>
            <g fill="#2a343a"><circle cx="9" cy="9" r="2.2"/><circle cx="269" cy="9" r="2.2"/><circle cx="9" cy="117" r="2.2"/><circle cx="269" cy="117" r="2.2"/></g>

            <!-- VOL knob with scale arc -->
            <path d="M 18,40 A 24 24 0 0 1 60,38" fill="none" stroke="#c9d4d8" stroke-width="0.8"/>
            <text x="39" y="18" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="5" font-weight="700" fill="#c9d4d8">VOL</text>
            <circle cx="39" cy="49" r="19" fill="#05090b" stroke="#2a3a44" stroke-width="1"/>
            <circle cx="39" cy="49" r="17" fill="none" stroke="#1d2a31" stroke-width="3" stroke-dasharray="1.4 1.8"/>
            <circle cx="39" cy="49" r="13" fill="url(#knob-grad)"/>
            <line x1="39" y1="49" x2="48" y2="58" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>

            <!-- Power button -->
            <rect x="10" y="67" width="15" height="9" rx="4.5" fill="#10181d" stroke="#8fa7ab" stroke-width="0.9"/>
            <circle cx="17.5" cy="71.5" r="2" fill="none" stroke="#c9d4d8" stroke-width="0.8"/>

            <!-- XIEGU -->
            <text x="50" y="77" font-family="'Space Grotesk', sans-serif" font-size="5.4" font-weight="800" fill="#e6eef0">XIEGU</text>

            <!-- Lower function knob -->
            <g fill="#8fa7ab"><circle cx="60" cy="88" r="0.9"/><circle cx="64" cy="96" r="0.9"/><circle cx="62" cy="106" r="0.9"/></g>
            <circle cx="42" cy="99" r="16" fill="#05090b" stroke="#2a3a44" stroke-width="1"/>
            <circle cx="42" cy="99" r="13" fill="url(#knob-grad)"/>
            <line x1="42" y1="99" x2="48" y2="90" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>

            <!-- Screen -->
            <text x="83" y="23" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="800" fill="#e6eef0">G90</text>
            <text x="165" y="23" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="4.8" font-weight="700" fill="#e6eef0">HF TRANSCEIVER</text>
            <rect x="75" y="28" width="92" height="77" rx="2" fill="#020507" stroke="#2f414c" stroke-width="1.2"/>
            <rect x="78" y="31" width="86" height="71" fill="#000"/>
